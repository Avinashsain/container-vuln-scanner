# ─────────────────────────────────────────────────────────────────────
# ACTIVE SERVICE — the single live entry-point for users
# Switch blue ↔ green by patching spec.selector.version:
#
#   Switch to Green:
#     kubectl patch svc frontend-active -n blue-green \
#       --type=merge \
#       -p '{"spec":{"selector":{"app":"frontend","version":"green"},
#            "ports":[{"protocol":"TCP","port":80,"targetPort":3200,"nodePort":30080}]}}'
#
#   Switch back to Blue:
#     kubectl patch svc frontend-active -n blue-green \
#       --type=merge \
#       -p '{"spec":{"selector":{"app":"frontend","version":"blue"},
#            "ports":[{"protocol":"TCP","port":80,"targetPort":3100,"nodePort":30080}]}}'
# ─────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: frontend-active
  namespace: blue-green
  labels:
    app: frontend
    role: active
spec:
  selector:
    app: frontend
    version: blue
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3100
      nodePort: 30080
  type: NodePort