# Note: the top-level `version:` key is deprecated in the current Compose
# Specification and is ignored (with a warning) by Compose v2 — dropped it.

services:

  # ── MongoDB ──────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: unless-stopped
    environment:
      # Added root credentials — the original had none, meaning anyone who
      # could reach this container had full unauthenticated DB access.
      # Values come from a local .env file (see note below), not hardcoded.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: userdb
    # Removed `ports: "27017:27017"`. The backend already reaches Mongo via
    # the internal app-network using the service name (mongodb:27017), so
    # publishing this to the host was unnecessary attack surface — anyone
    # who could reach the host on 27017 could hit the database directly.
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network
    healthcheck:
      # Updated to authenticate the ping using the same root credentials,
      # since auth is now enabled and the old unauthenticated ping would
      # start failing once credentials are required.
      test: ["CMD", "mongosh", "-u", "${MONGO_ROOT_USER}", "-p", "${MONGO_ROOT_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Backend API ───────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.vulnerabilities-fixed
    container_name: backend
    restart: unless-stopped
    environment:
      PORT: 8000
      # Updated to include the auth credentials now required by mongodb above.
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/userdb?authSource=admin
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Blue Frontend (Basic UI) ──────────────────
  frontend-blue:
    build:
      context: ./frontend-blue
      dockerfile: Dockerfile.vulnerabilities-fixed
    container_name: frontend-blue
    restart: unless-stopped
    environment:
      PORT: 3100
      BACKEND_URL: http://backend:8000
    ports:
      - "3100:3100"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Green Frontend (Enhanced UI) ─────────────
  frontend-green:
    build:
      context: ./frontend-green
      dockerfile: Dockerfile.vulnerabilities-fixed
    container_name: frontend-green
    restart: unless-stopped
    environment:
      PORT: 3200
      BACKEND_URL: http://backend:8000
    ports:
      - "3200:3200"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3200/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 10s

# ─────────────────────────────────────────────
volumes:
  mongo_data:
    driver: local

networks:
  app-network:
    driver: bridge