services:

  # ── MongoDB ──────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: userdb
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "-u", "${MONGO_ROOT_USER}", "-p", "${MONGO_ROOT_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Backend API ───────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.vulnerabilities-fixed
    container_name: backend
    restart: unless-stopped
    environment:
      PORT: 8000
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/userdb?authSource=admin
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Blue Frontend (Basic UI) ──────────────────
  frontend-blue:
    build:
      context: ./frontend-blue
      dockerfile: Dockerfile.vulnerabilities-fixed
    container_name: frontend-blue
    restart: unless-stopped
    environment:
      PORT: 3100
      BACKEND_URL: http://backend:8000
    ports:
      - "3100:3100"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Green Frontend (Enhanced UI) ─────────────
  frontend-green:
    build:
      context: ./frontend-green
      dockerfile: Dockerfile.vulnerabilities-fixed
    container_name: frontend-green
    restart: unless-stopped
    environment:
      PORT: 3200
      BACKEND_URL: http://backend:8000
    ports:
      - "3200:3200"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3200/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  mongo_data:
    driver: local

networks:
  app-network:
    driver: bridge