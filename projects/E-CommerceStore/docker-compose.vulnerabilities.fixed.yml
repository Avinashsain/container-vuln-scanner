services:

  # ─────────────────────────────────────────
  # BACKEND SERVICES
  # ─────────────────────────────────────────
  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile.vulnerabilities-fixed
    container_name: user-service
    
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - NODE_ENV=${NODE_ENV}
      - MONGODB_URI=${MONGODB_URI_USERS}
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  product-service:
    build:
      context: ./backend/product-service
      dockerfile: Dockerfile.vulnerabilities-fixed
    container_name: product-service
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - NODE_ENV=${NODE_ENV}
      - MONGODB_URI=${MONGODB_URI_PRODUCTS}
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  cart-service:
    build:
      context: ./backend/cart-service
      dockerfile: Dockerfile.vulnerabilities-fixed
    container_name: cart-service
    restart: unless-stopped
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - NODE_ENV=${NODE_ENV}
      - MONGODB_URI=${MONGODB_URI_CARTS}
      - PRODUCT_SERVICE_URL=${PRODUCT_SERVICE_URL}
      - USER_SERVICE_URL=${USER_SERVICE_URL}
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5003/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  order-service:
    build:
      context: ./backend/order-service
      dockerfile: Dockerfile.vulnerabilities-fixed
    container_name: order-service
    restart: unless-stopped
    ports:
      - "5004:5004"
    environment:
      - PORT=5004
      - NODE_ENV=${NODE_ENV}
      - MONGODB_URI=${MONGODB_URI_ORDERS}
      - CART_SERVICE_URL=${CART_SERVICE_URL}
      - PRODUCT_SERVICE_URL=${PRODUCT_SERVICE_URL}
      - USER_SERVICE_URL=${USER_SERVICE_URL}
    depends_on:
      cart-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5004/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─────────────────────────────────────────
  # FRONTEND
  # ─────────────────────────────────────────
  frontend-service:
    build:
      context: ./frontend
      dockerfile: Dockerfile.vulnerabilities-fixed
      # This image is a static build served by nginx, so REACT_APP_* has
      # to be baked in at build time via args — the runtime `environment:`
      # block used above (for the react-scripts dev server image) has no
      # effect on an already-compiled bundle.
      args:
        - REACT_APP_USER_SERVICE_URL=${REACT_APP_USER_SERVICE_URL}
        - REACT_APP_PRODUCT_SERVICE_URL=${REACT_APP_PRODUCT_SERVICE_URL}
        - REACT_APP_CART_SERVICE_URL=${REACT_APP_CART_SERVICE_URL}
        - REACT_APP_ORDER_SERVICE_URL=${REACT_APP_ORDER_SERVICE_URL}
    container_name: frontend-service
    restart: unless-stopped
    ports:
      - "5005:5005"
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    networks:
      - ecommerce-network

# ─────────────────────────────────────────
# NETWORKS
# ─────────────────────────────────────────
networks:
  ecommerce-network:
    driver: bridge