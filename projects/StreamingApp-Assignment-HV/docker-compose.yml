services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  auth:
    build:
      context: ./backend/authService
    depends_on:
      - mongo
    environment:
      PORT: 4001
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/${MONGO_DB:-streamingapp}?authSource=admin}
      JWT_SECRET: ${JWT_SECRET:-changeme}
      CLIENT_URLS: ${CLIENT_URLS:-http://localhost:4000}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
    ports:
      - "${AUTH_PORT:-4001}:4001"

  streaming:
    build:
      context: ./backend
      dockerfile: streamingService/Dockerfile
    depends_on:
      - mongo
    environment:
      PORT: 4002
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/${MONGO_DB:-streamingapp}?authSource=admin}
      JWT_SECRET: ${JWT_SECRET:-changeme}
      CLIENT_URLS: ${CLIENT_URLS:-http://localhost:4000}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_CDN_URL: ${AWS_CDN_URL:-}
      STREAMING_PUBLIC_URL: ${STREAMING_PUBLIC_URL:-http://localhost:4002}
    ports:
      - "${STREAMING_PORT:-4002}:4002"

  admin:
    build:
      context: ./backend
      dockerfile: adminService/Dockerfile
    depends_on:
      - mongo
    environment:
      PORT: 4003
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/${MONGO_DB:-streamingapp}?authSource=admin}
      JWT_SECRET: ${JWT_SECRET:-changeme}
      CLIENT_URLS: ${CLIENT_URLS:-http://localhost:4000}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_CDN_URL: ${AWS_CDN_URL:-}
    ports:
      - "${ADMIN_PORT:-4003}:4003"

  chat:
    build:
      context: ./backend
      dockerfile: chatService/Dockerfile
    depends_on:
      - mongo
    environment:
      PORT: 4004
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/${MONGO_DB:-streamingapp}?authSource=admin}
      JWT_SECRET: ${JWT_SECRET:-changeme}
      CLIENT_URLS: ${CLIENT_URLS:-http://localhost:4000}
    ports:
      - "${CHAT_PORT:-4004}:4004"

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_AUTH_API_URL: ${REACT_APP_AUTH_API_URL:-http://localhost:4001/api}
        REACT_APP_STREAMING_API_URL: ${REACT_APP_STREAMING_API_URL:-http://localhost:4002/api}
        REACT_APP_STREAMING_PUBLIC_URL: ${REACT_APP_STREAMING_PUBLIC_URL:-http://localhost:4002}
        REACT_APP_ADMIN_API_URL: ${REACT_APP_ADMIN_API_URL:-http://localhost:4003/api/admin}
        REACT_APP_CHAT_API_URL: ${REACT_APP_CHAT_API_URL:-http://localhost:4004/api/chat}
        REACT_APP_CHAT_SOCKET_URL: ${REACT_APP_CHAT_SOCKET_URL:-http://localhost:4004}
    depends_on:
      - auth
      - streaming
      - admin
      - chat
    ports:
      - "4008:80"

volumes:
  mongo-data:
