services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      # Mount our config file into the container
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  pushgateway:
    image: prom/pushgateway:latest
    container_name: pushgateway
    command:
      - "--persistence.file=/data/pushgateway.data"
      - "--persistence.interval=5m"
    ports:
      - "9091:9091"
    volumes:
      - pushgateway_data:/data

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123   # login password
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning
      - ./dashboards:/var/lib/grafana/dashboards

  sonarqube_db:
    image: postgres:15
    container_name: sonarqube_db
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
      - POSTGRES_DB=sonar
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data

  sonarqube:
    image: sonarqube:26.8.0.126808-community
    container_name: sonarqube
    depends_on:
      - sonarqube_db
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonarqube_db:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
    ports:
      - "9000:9000"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

  # --- Vulnerability dashboard app (separate from the SonarQube stack above) ---
  postgres:
    image: postgres:15
    container_name: vulnscanner_postgres
    environment:
      - POSTGRES_USER=vulnscanner
      - POSTGRES_PASSWORD=vulnscanner
      - POSTGRES_DB=vulnscanner
    ports:
      - "5433:5432"
    volumes:
      - vulnscanner_postgres_data:/var/lib/postgresql/data

  server:
    build: ./server
    container_name: vulnscanner_server
    depends_on:
      - postgres
    env_file:
      - ./server/.env
    environment:
      - DATABASE_URL=postgresql://vulnscanner:vulnscanner@postgres:5432/vulnscanner
      - REPO_ROOT=/app
      - REPORTS_DIR=/app/reports
    ports:
      - "4000:4000"
    volumes:
      - ./reports:/app/reports
      - ./configs:/app/configs
      - ./.trivyignore:/app/.trivyignore
      - /var/run/docker.sock:/var/run/docker.sock
      - trivy_cache:/root/.cache/trivy

  web:
    build: ./web
    container_name: vulnscanner_web
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  prometheus_data:
  grafana_data:
  pushgateway_data:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  vulnscanner_postgres_data:
  trivy_cache: